<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" x="76" y="88" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.18"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#brand)"/>
    <!-- the canvas: dark panel with whitish grid lines -->
    <rect x="76" y="98" width="360" height="336" rx="28" fill="#000000" opacity="0.18"/>
    <rect x="76" y="88" width="360" height="336" rx="28" fill="#241f52"/>
    <rect x="76" y="88" width="360" height="336" rx="28" fill="url(#grid)"/>
    <rect x="77.5" y="89.5" width="357" height="333" rx="26.5" fill="none"
          stroke="#ffffff" stroke-width="3" opacity="0.28"/>
  </g>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <g transform="rotate(12 256 256)" fill="#93c5fd">
      <rect x="214" y="136" width="84" height="84" rx="26"/>
      <rect x="214" y="136" width="84" height="84" rx="26" transform="rotate(72 256 256)"/>
      <rect x="214" y="136" width="84" height="84" rx="26" transform="rotate(144 256 256)"/>
      <rect x="214" y="136" width="84" height="84" rx="26" transform="rotate(216 256 256)"/>
      <rect x="214" y="136" width="84" height="84" rx="26" transform="rotate(288 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="34" fill="#fbbf24"/>
  </g>
</svg>
