<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <pattern id="grid" x="32" y="32" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 H 0 V 48" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.12"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#brand)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
  </g>
  <g fill="#ffffff" opacity="0.95">
    <rect x="124" y="124" width="120" height="120" rx="28"/>
    <rect x="124" y="268" width="120" height="120" rx="28"/>
    <rect x="268" y="268" width="120" height="120" rx="28"/>
  </g>
  <rect x="268" y="124" width="120" height="120" rx="28" fill="#fbbf24"
        transform="translate(12 -12) rotate(9 328 184)"/>
</svg>
