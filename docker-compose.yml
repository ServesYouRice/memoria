services:
  app:
    image: ${MEMORIA_IMAGE:-memoria:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: memoria-app
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      APP_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN}
      INTERNAL_OPERATIONS_TOKEN: ${INTERNAL_OPERATIONS_TOKEN}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-5}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER must be sendgrid or resend}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@memoria.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Memoria}
      EMAIL_SENDER_VERIFIED: ${EMAIL_SENDER_VERIFIED:-false}
      EMAIL_DELIVERY_PROBE_TO: ${EMAIL_DELIVERY_PROBE_TO:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FEATURE_BOOKMARK_UNFURLING: ${FEATURE_BOOKMARK_UNFURLING:-true}
      BOOKMARK_REFRESH_INTERVAL_MS: ${BOOKMARK_REFRESH_INTERVAL_MS:-900000}
      AI_ACTION_BUDGET_DAILY: ${AI_ACTION_BUDGET_DAILY:-1000}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-s3}
      UPLOAD_SCAN_URL: ${UPLOAD_SCAN_URL:-}
      UPLOAD_SCAN_REQUIRED: ${UPLOAD_SCAN_REQUIRED:-false}
      UPLOAD_SCAN_TIMEOUT_MS: ${UPLOAD_SCAN_TIMEOUT_MS:-10000}
      S3_BUCKET: ${S3_BUCKET:-memoria-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-memoria-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_MANIFEST_HMAC_KEY: ${BACKUP_MANIFEST_HMAC_KEY:-}
    ports:
      - '127.0.0.1:${OPERATIONS_HOST_PORT:-3002}:3000'
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --header="Authorization: Bearer $${INTERNAL_OPERATIONS_TOKEN}" -O /dev/null http://127.0.0.1:3000/api/ready']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      MEMORIA_ADDRESS: :3000
      INTERNAL_OPERATIONS_TOKEN: ${INTERNAL_OPERATIONS_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /config
      - /data

  migrate:
    image: ${MEMORIA_IMAGE:-memoria:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: 'no'

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    command: ['node', 'scripts/scheduler.mjs']
    environment:
      CRON_SECRET: ${CRON_SECRET}
      SCHEDULER_BASE_URL: http://app:3000
      BOOKMARK_REFRESH_INTERVAL_MS: ${BOOKMARK_REFRESH_INTERVAL_MS:-900000}
    read_only: true

  outbox-worker:
    image: ${MEMORIA_IMAGE:-memoria:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ['pnpm', 'worker:outbox']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN}
      INTERNAL_OPERATIONS_TOKEN: ${INTERNAL_OPERATIONS_TOKEN}
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER must be sendgrid or resend}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@memoria.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Memoria}
      EMAIL_SENDER_VERIFIED: ${EMAIL_SENDER_VERIFIED:-false}
      EMAIL_DELIVERY_PROBE_TO: ${EMAIL_DELIVERY_PROBE_TO:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-s3}
      S3_BUCKET: ${S3_BUCKET:-memoria-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-memoria-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_MANIFEST_HMAC_KEY: ${BACKUP_MANIFEST_HMAC_KEY:-}
      OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-30000}
      OUTBOX_HANDLER_TIMEOUT_MS: ${OUTBOX_HANDLER_TIMEOUT_MS:-15000}
      OUTBOX_CONCURRENCY: ${OUTBOX_CONCURRENCY:-4}
    read_only: true

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: ['./scripts/run-backup-schedule.sh']
    environment:
      ENVIRONMENT: prod
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: memoria
      PGDATABASE: memoria
      PGPASSWORD: ${DATABASE_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      AWS_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_MANIFEST_HMAC_KEY: ${BACKUP_MANIFEST_HMAC_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_SSE: ${BACKUP_S3_SSE:-AES256}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      S3_BUCKET: ${S3_BUCKET:-memoria-uploads}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    read_only: true
    tmpfs:
      - /tmp
      - /var/log

  backup-monitor:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    init: true
    command: ['./scripts/run-backup-freshness-loop.sh']
    environment:
      REDIS_URL: ${REDIS_URL}
      AWS_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      MAX_BACKUP_AGE_SECONDS: ${MAX_BACKUP_AGE_SECONDS:-5400}
      BACKUP_FRESHNESS_INTERVAL_SECONDS: ${BACKUP_FRESHNESS_INTERVAL_SECONDS:-900}
    read_only: true
    tmpfs:
      - /tmp

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['observability']
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - internal_operations_token
    ports:
      - '127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090'

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ['observability']
    restart: unless-stopped
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - '127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093'

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ['observability']
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000'

  postgres:
    image: pgvector/pgvector:pg16
    container_name: memoria-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: memoria
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memoria']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: memoria-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping']
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: memoria-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_data:
    driver: local

secrets:
  internal_operations_token:
    environment: INTERNAL_OPERATIONS_TOKEN
