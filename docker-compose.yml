version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: canvascollect-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: canvascollect
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-devpassword}
      POSTGRES_DB: canvascollect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canvascollect']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
