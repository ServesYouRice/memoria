global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: memoria
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/internal_operations_token
    static_configs:
      - targets: ['app:3000']
