packages:
  - .

verifyDepsBeforeRun: false

overrides:
  # GHSA-38f7-945m-qr2g: effect <3.20.0 loses AsyncLocalStorage context under
  # concurrent RPC load. Pulled in only transitively via prisma → @prisma/config.
  "effect@<3.20.0": ">=3.20.0"
  # GHSA-7fh5-64p2-3v2j: postcss <8.5.10 XSS via unescaped </style>. Bundled by
  # next; a patch-line bump to the fixed 8.5.x is safe for the build pipeline.
  "postcss@<8.5.10": ">=8.5.10"
  # GHSA-v2hh-gcrm-f6hx and GHSA-7p8r-x3mc-p8w7: fast-uri <3.1.5 confuses the
  # authority when parsing a literal or a backslash introducer. Reached only
  # transitively, through ajv under @hookform/resolvers and prisma.
  "fast-uri@<3.1.7": ">=3.1.7 <4"
  # GHSA-4cwx-7wf7-3272: undici <7.29.0 can disclose one user's data to another
  # across pooled connections.
  "undici@<7.29.0": ">=7.29.0 <8"
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts <8.0.0 exhausts the stack on a recursive
  # object graph. Pulled in only transitively via prisma -> @prisma/config.
  "deepmerge-ts@<8.0.0": ">=8.0.0 <9"

  # undici advisories (TLS validation bypass, cross-origin redirect cache
  # poisoning, renegotiation DoS): patched in 7.30.1 and 8.12.2. Reached via
  # cheerio (7.x) and jsdom under isomorphic-dompurify (8.x).
  "undici@>=7 <7.30.1": ">=7.30.1 <8"
  "undici@>=8 <8.12.2": ">=8.12.2 <9"
  # Transitive via prisma/@prisma/client and tiptap respectively.
  "mysql2@<3.22.0": ">=3.22.0 <4"
  "prosemirror-view@<1.42.3": ">=1.42.3 <2"
  "source-map-js@<1.2.2": ">=1.2.2 <2"
  "dompurify@<3.4.17": ">=3.4.17 <4"
  "sharp@<0.35.5": ">=0.35.5 <1"
  # GHSA-p6vx-979v-rg4c and later seroval advisories (deserialization invokes
  # attacker-chosen callables): patched in 1.6.8. Reached only transitively via
  # solid-js under better-auth and the devtools; this app does not deserialize
  # untrusted seroval payloads.
  "seroval@<1.6.8": ">=1.6.8 <2"
  "seroval-plugins@<1.6.8": ">=1.6.8 <2"

allowBuilds:
  "@percy/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  argon2: true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
