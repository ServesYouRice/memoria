name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run tests with coverage
        run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          AUTH_SECRET: 'ci-build-secret-0123456789abcdef-placeholder'
          AUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'ci-build-secret-0123456789abcdef-placeholder'
          NEXTAUTH_URL: 'http://localhost:3000'
          # next build runs under NODE_ENV=production, so route modules that
          # import the env module trigger the production-only requirements.
          REDIS_URL: 'redis://localhost:6379'
          UPLOAD_STORAGE: 's3'
          S3_BUCKET: 'ci-placeholder-bucket'
          S3_REGION: 'us-east-1'
          S3_ENDPOINT: 'http://localhost:9000'
          S3_ACCESS_KEY_ID: 'ci-placeholder'
          S3_SECRET_ACCESS_KEY: 'ci-placeholder-secret'
          APP_BOOTSTRAP_TOKEN: 'ci-placeholder-bootstrap-token'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: 'postgresql://postgres:test@localhost:5432/test'

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: 'postgresql://postgres:test@localhost:5432/test'
          AUTH_SECRET: 'e2e-test-secret-0123456789abcdef-placeholder'
          AUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'e2e-test-secret-0123456789abcdef-placeholder'
          NEXTAUTH_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          UPLOAD_STORAGE: 's3'
          S3_BUCKET: 'ci-placeholder-bucket'
          S3_REGION: 'us-east-1'
          S3_ENDPOINT: 'http://localhost:9000'
          S3_ACCESS_KEY_ID: 'ci-placeholder'
          S3_SECRET_ACCESS_KEY: 'ci-placeholder-secret'
          APP_BOOTSTRAP_TOKEN: 'ci-placeholder-bootstrap-token'

