name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.14.0'
  PNPM_VERSION: '11.13.0'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run tests with coverage
        run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          AUTH_SECRET: 'ci-build-secret-0123456789abcdef-placeholder'
          AUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'ci-build-secret-0123456789abcdef-placeholder'
          NEXTAUTH_URL: 'http://localhost:3000'
          # next build runs under NODE_ENV=production, so route modules that
          # import the env module trigger the production-only requirements.
          REDIS_URL: 'redis://localhost:6379'
          UPLOAD_STORAGE: 's3'
          S3_BUCKET: 'ci-placeholder-bucket'
          S3_REGION: 'us-east-1'
          S3_ENDPOINT: 'http://localhost:9000'
          S3_ACCESS_KEY_ID: 'ci-placeholder'
          S3_SECRET_ACCESS_KEY: 'ci-placeholder-secret'
          APP_BOOTSTRAP_TOKEN: 'ci-placeholder-bootstrap-token'
          MODEL_CREDENTIAL_ENCRYPTION_KEY: 'ci-model-credential-key-0123456789abcdef'
          EMAIL_PROVIDER: 'sendgrid'
          SENDGRID_API_KEY: 'ci-placeholder-sendgrid-key'

  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - name: Inventory production dependency licenses
        run: pnpm licenses list --prod

  dependency-review:
    name: Dependency License & Vulnerability Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  container-build:
    name: Clean Container Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image from a clean checkout
        run: docker build --pull --tag memoria:ci .
      - name: Generate a CycloneDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: memoria:ci
          format: cyclonedx-json
          output-file: memoria-sbom.cdx.json
          upload-artifact: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:RELEASE.2025-02-03T21-03-04Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin-test-password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: 'postgresql://postgres:test@localhost:5432/test'

      - name: Create test upload bucket
        run: >-
          docker run --rm --network host minio/mc
          sh -c "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin-test-password && mc mb --ignore-existing local/memoria-test"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: 'postgresql://postgres:test@localhost:5432/test'
          AUTH_SECRET: 'e2e-test-secret-0123456789abcdef-placeholder'
          AUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'e2e-test-secret-0123456789abcdef-placeholder'
          NEXTAUTH_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          UPLOAD_STORAGE: 's3'
          S3_BUCKET: 'memoria-test'
          S3_REGION: 'us-east-1'
          S3_ENDPOINT: 'http://127.0.0.1:9000'
          S3_ACCESS_KEY_ID: 'minioadmin'
          S3_SECRET_ACCESS_KEY: 'minioadmin-test-password'
          APP_BOOTSTRAP_TOKEN: 'ci-placeholder-bootstrap-token'
          MODEL_CREDENTIAL_ENCRYPTION_KEY: 'e2e-model-credential-key-0123456789abcdef'
          EMAIL_PROVIDER: 'sendgrid'
          SENDGRID_API_KEY: 'e2e-placeholder-sendgrid-key'

