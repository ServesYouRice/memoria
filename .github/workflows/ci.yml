name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.14.0'
  # 11.13.0 shipped a broken @pnpm/exe build with no binary; pnpm/action-setup
  # refuses to install it, which failed every job before its first real step.
  PNPM_VERSION: '11.13.1'
  # prisma.config.ts resolves the datasource from DATABASE_URL, so `prisma
  # generate` refuses to run without one even though generation never connects.
  PRISMA_GENERATE_DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ env.PRISMA_GENERATE_DATABASE_URL }}

      - name: Run ESLint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ env.PRISMA_GENERATE_DATABASE_URL }}

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Run explicit API route coverage gate
        run: pnpm test:coverage:routes

      - name: Retain route coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: route-coverage-report
          path: coverage/routes/

  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: memoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memoria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: 'postgresql://postgres:test@localhost:5432/memoria_test'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ env.PRISMA_GENERATE_DATABASE_URL }}

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          AUTH_SECRET: 'ci-build-secret-0123456789abcdef-placeholder'
          AUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'ci-build-secret-0123456789abcdef-placeholder'
          NEXTAUTH_URL: 'http://localhost:3000'
          # next build runs under NODE_ENV=production, so route modules that
          # import the env module trigger the production-only requirements.
          REDIS_URL: 'redis://localhost:6379'
          UPLOAD_STORAGE: 's3'
          S3_BUCKET: 'ci-placeholder-bucket'
          S3_REGION: 'us-east-1'
          S3_ENDPOINT: 'http://localhost:9000'
          S3_ACCESS_KEY_ID: 'ci-placeholder'
          S3_SECRET_ACCESS_KEY: 'ci-placeholder-secret'
          APP_BOOTSTRAP_TOKEN: 'ci-placeholder-bootstrap-token'
          INTERNAL_OPERATIONS_TOKEN: 'ci-operations-token-0123456789abcdef'
          MODEL_CREDENTIAL_ENCRYPTION_KEY: 'ci-model-credential-key-0123456789abcdef'
          EMAIL_PROVIDER: 'sendgrid'
          SENDGRID_API_KEY: 'ci-placeholder-sendgrid-key'

      - name: Enforce App Router bundle budgets
        run: pnpm check-bundle

      - name: Retain bundle evidence
        uses: actions/upload-artifact@v7
        with:
          name: bundle-budget
          path: .next/bundle-budget.json

  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - name: Inventory production dependency licenses
        run: pnpm licenses list --prod

  dependency-review:
    name: Dependency License & Vulnerability Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  container-build:
    name: Clean Container Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image from a clean checkout
        run: docker build --pull --tag memoria:ci .
      - name: Generate a CycloneDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: memoria:ci
          format: cyclonedx-json
          output-file: memoria-sbom.cdx.json
          upload-artifact: true

  e2e:
    name: Production E2E & Operations Gate
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ env.PRISMA_GENERATE_DATABASE_URL }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run production image E2E and operations smoke
        run: pnpm test:e2e

      - name: Retain browser traces, screenshots, and service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

