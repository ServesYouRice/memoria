services:
  restore-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: memoria-isolated-restore
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - restore_postgres_data:/var/lib/postgresql/data

  restore-minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    command: server /data
    environment:
      MINIO_ROOT_USER: memoriarestore
      MINIO_ROOT_PASSWORD: memoria-isolated-restore-password
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - restore_minio_data:/data

  restore-minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      restore-minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set restore http://restore-minio:9000 memoriarestore memoria-isolated-restore-password &&
        mc mb --ignore-existing restore/memoria-restore
    restart: 'no'

  restore-runner:
    container_name: memoria-restore-runner
    build:
      context: .
      dockerfile: Dockerfile.backup
    init: true
    depends_on:
      restore-postgres:
        condition: service_healthy
      restore-minio-init:
        condition: service_completed_successfully
    command:
      - ./scripts/restore-database.sh
      - --manifest-key
      - ${RESTORE_MANIFEST_KEY:?Set RESTORE_MANIFEST_KEY to the exact completed manifest}
      - --target-database
      - memoria_restore
      - --output-dir
      - /evidence
      - --drill
    environment:
      ENVIRONMENT: prod
      PGHOST: restore-postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: memoria-isolated-restore
      AWS_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?Set BACKUP_BUCKET}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?Set BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?Set BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_MANIFEST_HMAC_KEY: ${BACKUP_MANIFEST_HMAC_KEY:?Set BACKUP_MANIFEST_HMAC_KEY}
      S3_BUCKET: memoria-restore
      S3_ENDPOINT: http://restore-minio:9000
      S3_ACCESS_KEY_ID: memoriarestore
      S3_SECRET_ACCESS_KEY: memoria-isolated-restore-password
      RESTORE_ISOLATED_ACK: 'true'
      RESTORE_MAX_RPO_SECONDS: ${RESTORE_MAX_RPO_SECONDS:-3600}
      RESTORE_MAX_RTO_SECONDS: ${RESTORE_MAX_RTO_SECONDS:-14400}
      LOG_FILE: /evidence/restore.log
    volumes:
      - restore_evidence:/evidence
    restart: 'no'

volumes:
  restore_postgres_data:
  restore_minio_data:
  restore_evidence:
