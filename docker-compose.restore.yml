services:
  restore-postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: memoria-isolated-restore
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - restore_postgres_data:/var/lib/postgresql

  # S3-compatible stand-in (MinIO's images were withdrawn from Docker Hub).
  restore-minio:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '{"identities":[{"name":"memoria","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "memoriarestore" "memoria-isolated-restore-password" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9000/healthz']
      interval: 2s
      timeout: 3s
      retries: 60
    volumes:
      - restore_minio_data:/data

  restore-minio-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      restore-minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: memoriarestore
      AWS_SECRET_ACCESS_KEY: memoria-isolated-restore-password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        aws --endpoint-url http://restore-minio:9000 s3api head-bucket --bucket memoria-restore ||
        aws --endpoint-url http://restore-minio:9000 s3 mb s3://memoria-restore
    restart: 'no'

  restore-runner:
    container_name: memoria-restore-runner
    build:
      context: .
      dockerfile: Dockerfile.backup
    init: true
    depends_on:
      restore-postgres:
        condition: service_healthy
      restore-minio-init:
        condition: service_completed_successfully
    command:
      - ./scripts/restore-database.sh
      - --manifest-key
      - ${RESTORE_MANIFEST_KEY:?Set RESTORE_MANIFEST_KEY to the exact completed manifest}
      - --target-database
      - memoria_restore
      - --output-dir
      - /evidence
      - --drill
    environment:
      ENVIRONMENT: prod
      PGHOST: restore-postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: memoria-isolated-restore
      AWS_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?Set BACKUP_BUCKET}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?Set BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?Set BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_MANIFEST_HMAC_KEY: ${BACKUP_MANIFEST_HMAC_KEY:?Set BACKUP_MANIFEST_HMAC_KEY}
      S3_BUCKET: memoria-restore
      S3_ENDPOINT: http://restore-minio:9000
      S3_ACCESS_KEY_ID: memoriarestore
      S3_SECRET_ACCESS_KEY: memoria-isolated-restore-password
      RESTORE_ISOLATED_ACK: 'true'
      RESTORE_MAX_RPO_SECONDS: ${RESTORE_MAX_RPO_SECONDS:-3600}
      RESTORE_MAX_RTO_SECONDS: ${RESTORE_MAX_RTO_SECONDS:-14400}
      LOG_FILE: /evidence/restore.log
    volumes:
      - restore_evidence:/evidence
    restart: 'no'

volumes:
  restore_postgres_data:
  restore_minio_data:
  restore_evidence:
