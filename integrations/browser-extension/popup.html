<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memoria</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <section id="setup" hidden>
      <h1>Connect to Memoria</h1>
      <p class="hint">
        In Memoria, open <strong>API Keys</strong>, create a key, and paste it
        here with your Memoria address.
      </p>
      <form id="setup-form">
        <label>
          Memoria address
          <input
            id="server-url"
            type="text"
            inputmode="url"
            placeholder="https://memoria.example.com"
            autocomplete="url"
            required
          />
        </label>
        <label>
          API key
          <input
            id="api-key"
            type="password"
            placeholder="mk_..."
            autocomplete="off"
            required
          />
        </label>
        <p id="setup-error" class="error" role="alert" hidden></p>
        <div class="actions">
          <button id="setup-cancel" type="button" class="secondary" hidden>
            Cancel
          </button>
          <button type="submit">Save</button>
        </div>
      </form>
    </section>

    <section id="main" hidden>
      <header>
        <h1>Save tabs to Memoria</h1>
        <button id="open-settings" type="button" class="link">Settings</button>
      </header>
      <div class="toolbar">
        <label class="inline">
          <input id="toggle-all" type="checkbox" />
          <span id="selection-count">0 selected</span>
        </label>
      </div>
      <ul id="tab-list" aria-label="Tabs in this window"></ul>
      <label>
        How should these be sorted?
        <textarea
          id="note"
          rows="2"
          maxlength="2000"
          placeholder="Optional, e.g. group by trip and keep the tickets together"
        ></textarea>
      </label>
      <p id="save-error" class="error" role="alert" hidden></p>
      <p id="save-status" class="status" role="status" hidden></p>
      <div class="actions">
        <button id="save" type="button">Save and close tabs</button>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
