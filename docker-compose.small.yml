# Small set-up (IMP-100): one replica of each process Memoria needs, uploads
# on a local disk volume. Start it with `pnpm setup:small`.
#
# Runs: app (web + API, and it forwards live connections to sync), sync
# (saves co-edits), outbox-worker (email, thumbnails, imports), scheduler
# (timed jobs), PostgreSQL and Redis, plus the one-off database migration.
#
# Leaves out, compared with docker-compose.yml:
# - bundled object storage (SeaweedFS): uploads live in the `uploads_data`
#   volume, so the app cannot run a second replica and the volume must be
#   backed up with the database;
# - the backup and backup-monitor services: no scheduled, checked off-host
#   backups. Run `scripts/backup-database.sh` yourself or use the full set-up;
# - the Caddy gateway: put your own TLS proxy (Caddy, nginx, Traefik,
#   Cloudflare Tunnel) in front of 127.0.0.1:${APP_HOST_PORT}, and make sure
#   it passes WebSockets for /api/collaboration/;
# - second replicas and monitoring profiles.

x-image: &image
  image: ${MEMORIA_IMAGE:-memoria:local}
  build:
    context: .
    dockerfile: Dockerfile

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-memoria:}
  AUTH_URL: ${AUTH_URL}
  AUTH_SECRET: ${AUTH_SECRET}
  NEXTAUTH_URL: ${NEXTAUTH_URL}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  APP_BOOTSTRAP_TOKEN: ${APP_BOOTSTRAP_TOKEN}
  INTERNAL_OPERATIONS_TOKEN: ${INTERNAL_OPERATIONS_TOKEN}
  REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
  COLLABORATION_PROXY_SECRET: ${COLLABORATION_PROXY_SECRET:-}
  MODEL_CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY}
  CRON_SECRET: ${CRON_SECRET}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER must be sendgrid, resend, or smtp}
  EMAIL_FROM: ${EMAIL_FROM:-noreply@memoria.local}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Memoria}
  EMAIL_SENDER_VERIFIED: ${EMAIL_SENDER_VERIFIED:-false}
  EMAIL_DELIVERY_PROBE_TO: ${EMAIL_DELIVERY_PROBE_TO:-}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
  UPLOAD_STORAGE: local
  UPLOAD_LOCAL_DIR: /data/uploads
  UPLOAD_SCAN_URL: ${UPLOAD_SCAN_URL:-}
  UPLOAD_SCAN_REQUIRED: ${UPLOAD_SCAN_REQUIRED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  app:
    <<: *image
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: 3000
      SYNC_SERVER_INTERNAL_URL: http://sync:3001
      FEATURE_BOOKMARK_UNFURLING: ${FEATURE_BOOKMARK_UNFURLING:-true}
      AI_ACTION_BUDGET_DAILY: ${AI_ACTION_BUDGET_DAILY:-1000}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - uploads_data:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q --header="Authorization: Bearer $${INTERNAL_OPERATIONS_TOKEN}" -O /dev/null http://127.0.0.1:3000/api/ready',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    <<: *image
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  sync:
    <<: *image
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["pnpm", "sync:server"]
    environment:
      <<: *app-env
      SYNC_SERVER_PORT: 3001
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  outbox-worker:
    <<: *image
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["pnpm", "worker:outbox"]
    environment:
      <<: *app-env
      OUTBOX_CONCURRENCY: ${OUTBOX_CONCURRENCY:-2}
    # Thumbnails, imports and canvas copies read and write uploads too.
    volumes:
      - uploads_data:/data/uploads
    read_only: true
    tmpfs:
      - /tmp

  scheduler:
    <<: *image
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "scripts/scheduler.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
      SCHEDULER_BASE_URL: http://app:3000
    read_only: true

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoria
      POSTGRES_DB: memoria
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping']
      interval: 10s
      timeout: 3s
      retries: 5

# Fixed range so setup can trust exactly the gateway address, where the
# host's own TLS proxy appears (SMALL_NETWORK_GATEWAY_CIDR in setup.mjs).
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.48.0/28
          gateway: 172.29.48.1

volumes:
  postgres_data:
  redis_data:
  uploads_data:
